# local postgres for dev, nothing fancy
# run:  docker compose up -d
# stop: docker compose down   (add -v if you want to nuke the data too)
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vonbook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vonbook
      POSTGRES_PASSWORD: vonbook_dev_password
      POSTGRES_DB: vonbook
    ports:
      - "5434:5432"
    volumes:
      - vonbook_pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vonbook -d vonbook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vonbook_pg_data:
